name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.10 is the floor package.json declares; 22 is what a current SignalK
        # install is likely to be on. Both, because bare `node --test` file
        # discovery has changed across Node majors and this repo relies on it.
        node: ['20.10', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci || npm install

      - name: Syntax check
        run: npm run check

      # public/ (the Plugin Config panel) is committed because nothing is built
      # on the boat. Rebuild it and fail if the committed copy is stale.
      - name: Panel bundle is up to date
        run: npm run build:config && git status --porcelain -- public && test -z "$(git status --porcelain -- public)"

      - name: Unit tests
        run: npm test

  # The connector's plan etag must byte-for-byte match boat_plan.plan_etag in the
  # cloud bundle. Nothing in either repo can catch a divergence alone: both sides
  # pass their own tests while disagreeing about which plan a boat is running.
  #
  # Already caught once this way — Python's json.dumps defaults to
  # ensure_ascii=True and JSON.stringify does not, so any boat with a non-ASCII
  # name (Sørøya) hashed differently on the two sides, permanently.
  #
  # This job checks out the cloud repo and runs the YEY_BUNDLE_PATH-gated tests,
  # which otherwise skip.
  cross-repo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: connector

      # The bundle is not public, so this job needs NAVIGATOR_READ_TOKEN. Fork
      # PRs never get secrets: there the check is skipped with a warning (a known
      # gap). Everywhere else — push to main, PRs from this repo — a missing
      # token FAILS the job: a contract check that silently stops running is
      # indistinguishable from one that passes.
      - name: Require the navigator token (skip only on forks)
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.NAVIGATOR_READ_TOKEN != '' }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK" = "true" ]; then
            echo "::warning::Cross-repo contract check SKIPPED on a fork PR (no secrets)."
            echo "::warning::The etag agreement with boat_plan.py is UNVERIFIED on this run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::NAVIGATOR_READ_TOKEN is not set, so the cross-repo contract"
            echo "::error::check cannot run. Add a read-only token for yey-boats/navigator"
            echo "::error::as the NAVIGATOR_READ_TOKEN Actions secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          repository: yey-boats/navigator
          path: navigator
          token: ${{ secrets.NAVIGATOR_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        working-directory: connector
        run: npm ci || npm install

      - name: Contract tests against the real bundle
        if: steps.gate.outputs.run == 'true'
        working-directory: connector
        env:
          YEY_BUNDLE_PATH: ${{ github.workspace }}/navigator
        run: npm test
